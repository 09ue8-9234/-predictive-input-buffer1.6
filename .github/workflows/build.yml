name: Build Mod
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  tests:
    name: Decision-rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the tests
        run: |
          g++ -std=c++20 -Wall -Wextra -o prediction_policy_test tests/prediction_policy_test.cpp
          ./prediction_policy_test
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # pinned: the action's default ("latest") now installs Geode 6.0.0-alpha.1, which this mod
          # (made for Geode 5.11.2, see mod.json) does not build against
          sdk: v5.11.2
          combine: true
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
